name: Build, Test & Deploy

on:
  push:
    branches: [ main ]        # Main branch triggers build+test+deploy
  pull_request:
    branches: [ main, develop ]  # PRs only run build+test
  workflow_dispatch:          # Allow manual triggering

env:
  DEFAULT_LISTEN_PORT: "9000"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Compile
        run: ./mvnw -B compile

      - name: Run tests with H2 in-memory DB
        run: |
          ./mvnw -B test \
            -Dspring.datasource.url=jdbc:h2:mem:test \
            -Dspring.datasource.driverClassName=org.h2.Driver \
            -Dspring.jpa.hibernate.ddl-auto=create-drop \
            -Dflyway.enabled=false \
            -Dspring.jpa.show-sql=false \
            -Dspring.jpa.properties.hibernate.format_sql=false
        env:
          SPRING_FLYWAY_ENABLED: "false"

      - name: Package (skip tests)
        run: ./mvnw -B package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: innova-serve-jar
          path: target/*.jar

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            target/surefire-reports/*.txt
            target/surefire-reports/*.xml
          retention-days: 14

  deploy-to-catalyst:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'   # Only deploy on main branch pushes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: innova-serve-jar
          path: target/

      - name: Install Node.js (for Catalyst CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Zoho Catalyst CLI globally
        run: npm install -g zcatalyst-cli@beta

      - name: Authenticate with Zoho Catalyst
        env:
          CATALYST_TOKEN: ${{ secrets.CATALYST_TOKEN }}
        run: |
          catalyst login --token "$CATALYST_TOKEN"

      - name: Configure environment variables for Catalyst
        env:
          CATALYST_PROJECT_NAME: ${{ secrets.CATALYST_PROJECT_NAME }}
        run: |
          cat > catalyst-app-config.json <<'EOF'
          {
            "env_variables": {
              "CATALYST_APP_JWT_SECRET": "${{ secrets.CATALYST_APP_JWT_SECRET }}",
              "CATALYST_TENANT_PROVISIONING_KEY": "${{ secrets.CATALYST_TENANT_PROVISIONING_KEY }}",
              "CATALYST_DB_URL": "${{ secrets.CATALYST_DB_URL }}",
              "CATALYST_DB_USERNAME": "${{ secrets.CATALYST_DB_USERNAME }}",
              "CATALYST_DB_PASSWORD": "${{ secrets.CATALYST_DB_PASSWORD }}",
              "CATALYST_DB_SCHEMAS": "${{ secrets.CATALYST_DB_SCHEMAS || 'core,stay,restaurant,expense' }}",
              "CATALYST_DB_DEFAULT_SCHEMA": "${{ secrets.CATALYST_DB_DEFAULT_SCHEMA || 'core' }}",
              "CATALYST_FLYWAY_ENABLED": "${{ secrets.CATALYST_FLYWAY_ENABLED || 'true' }}",
              "SMTP_HOST": "${{ secrets.SMTP_HOST }}",
              "SMTP_USERNAME": "${{ secrets.SMTP_USERNAME }}",
              "SMTP_PASSWORD": "${{ secrets.SMTP_PASSWORD }}",
              "APP_MAIL_FROM": "${{ secrets.APP_MAIL_FROM }}",
              "APP_PASSWORD_RESET_BASE_URL": "${{ secrets.APP_PASSWORD_RESET_BASE_URL }}",
              "X_ZOHO_CATALYST_LISTEN_PORT": "${{ secrets.X_ZOHO_CATALYST_LISTEN_PORT || '9000' }}"
            }
          }
          EOF
          catalyst app-config update --config ./catalyst-app-config.json --project "$CATALYST_PROJECT_NAME"

      - name: Deploy to Zoho Catalyst
        env:
          CATALYST_APP_NAME: ${{ secrets.CATALYST_APP_NAME }}
        run: |
          echo "Deploying InnovaServe to Zoho Catalyst..."
          catalyst deploy appsail \
            --name "$CATALYST_APP_NAME" \
            --build-path "target/*.jar" \
            --stack "java17" \
            --platform "javase" \
            --command "sh -c 'java -jar *.jar --server.port=${X_ZOHO_CATALYST_LISTEN_PORT}'" \
            --verbose

      - name: Post-deployment notification
        if: success()
        run: |
          echo "✅ Deployment to Zoho Catalyst successful!"
          echo "App: ${{ secrets.CATALYST_APP_NAME }}"
          echo "Project: ${{ secrets.CATALYST_PROJECT_NAME }}"