spring.application.name=InnovaServe-test
spring.profiles.active=test
spring.config.import=
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://127.0.0.1:55447/innovaserve_test}
spring.datasource.username=postgres
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.schemas=core,stay,restaurant,expense,inventory,platform
spring.flyway.default-schema=core
spring.flyway.ignore-migration-patterns=versioned:missing
app.jwt.secret=test-only-tenant-signing-key-at-least-32-characters
app.platform.jwt-secret=test-only-platform-signing-key-at-least-32-characters
app.platform.bootstrap.enabled=false
app.payments.demo-mode=false
app.mail.provider=smtp
app.mail.from=
app.mail.resend-api-key=
spring.mail.host=
app.cors.allowed-origins=https://staff.example.com
app.platform.cors.allowed-origins=https://platform.example.com
