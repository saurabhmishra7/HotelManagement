spring.application.name=InnovaServe

# ---- Environment-secrets (set via GitHub Secrets / Catalyst env) ----
# Do NOT commit sensitive values. Provide defaults only for local/CI test builds.
app.jwt.secret=${CATALYST_APP_JWT_SECRET:default-dev-jwt-secret-change-me-in-prod}
app.tenant-provisioning-key=${CATALYST_TENANT_PROVISIONING_KEY:default-dev-key-change-me-in-prod}
spring.flyway.enabled=${CATALYST_FLYWAY_ENABLED:true}
spring.flyway.schemas=${CATALYST_DB_SCHEMAS:core,stay,restaurant,expense}
spring.flyway.default-schema=${CATALYST_DB_DEFAULT_SCHEMA:core}

# Database (PostgreSQL - default to a placeholder so the project compiles/runs locally without a DB)
spring.datasource.url=${CATALYST_DB_URL:jdbc:postgresql://localhost:5432/innervasenotdb}
spring.datasource.username=${CATALYST_DB_USERNAME:placeholder}
spring.datasource.password=${CATALYST_DB_PASSWORD:placeholder}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---- Mail (SMTP) ----
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${APP_MAIL_FROM:no-reply@innova.example}
app.password-reset.base-url=${APP_PASSWORD_RESET_BASE_URL:http://localhost:3000/reset-password}

# Logging
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG
logging.level.org.hibernate.SQL=DEBUG
server.port=${X_ZOHO_CATALYST_LISTEN_PORT:9000}