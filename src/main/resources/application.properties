spring.application.name=InnovaServe

# Secrets and DB config come from environment variables (set in CI and in Catalyst)
app.jwt.secret=${CATALYST_APP_JWT_SECRET}
app.tenant.provisioning-key=${CATALYST_TENANT_PROVISIONING_KEY}

spring.datasource.url=${CATALYST_DB_URL}
spring.datasource.username=${CATALYST_DB_USERNAME}
spring.datasource.password=${CATALYST_DB_PASSWORD}

spring.flyway.enabled=true
spring.flyway.schemas=core,stay,restaurant,expense
spring.flyway.default-schema=core

spring.jpa.hibernate.ddl-auto=validate

# Verbose logging: remove these once things are stable
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG
logging.level.org.hibernate.SQL=DEBUG