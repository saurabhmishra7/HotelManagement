spring.application.name=InnovaServe
# Local override is outside the classpath/JAR and ignored by Git.
spring.config.import=optional:file:./.env.properties
server.port=${X_ZOHO_CATALYST_LISTEN_PORT:${PORT:8080}}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=12MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.schemas=core,stay,restaurant,expense,inventory,platform
spring.flyway.default-schema=core
# Historical V46 was removed; documented in DATA_MODEL.md. Do not ignore checksum errors.
spring.flyway.ignore-migration-patterns=versioned:missing
app.jwt.secret=${JWT_SECRET}
app.platform.jwt-secret=${PLATFORM_JWT_SECRET}
app.tenant-provisioning-key=${TENANT_PROVISIONING_KEY:}
app.platform.bootstrap.enabled=${PLATFORM_BOOTSTRAP_ENABLED:false}
app.platform.bootstrap.name=${PLATFORM_BOOTSTRAP_NAME:Administrator}
app.platform.bootstrap.email=${PLATFORM_BOOTSTRAP_EMAIL:}
app.platform.bootstrap.password=${PLATFORM_BOOTSTRAP_PASSWORD:}
app.platform.cors.allowed-origins=${PLATFORM_ALLOWED_ORIGINS:}
app.cors.allowed-origins=${APP_ALLOWED_ORIGINS:}
app.payments.demo-mode=${APP_DEMO_PAYMENT_ENABLED:false}
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.mail.provider=${APP_MAIL_PROVIDER:smtp}
app.mail.from=${APP_MAIL_FROM:}
app.mail.resend-api-key=${APP_MAIL_RESEND_API_KEY:}
app.mail.dev-recipient=${APP_MAIL_DEV_RECIPIENT:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.signup.verification-base-url=${APP_SIGNUP_VERIFICATION_BASE_URL:http://localhost:3000/}
app.password-reset.base-url=${APP_PASSWORD_RESET_BASE_URL:http://localhost:3000/}
app.staff-invitation.base-url=${APP_STAFF_INVITATION_BASE_URL:http://localhost:3000/invite}
app.staff-approval.base-url=${APP_STAFF_APPROVAL_BASE_URL:http://localhost:3000/}
app.email-verification.base-url=${APP_EMAIL_VERIFICATION_BASE_URL:http://localhost:3000/}
app.expense.receipt-storage-dir=${RECEIPT_STORAGE_DIR:var/expense-receipts}
logging.level.org.hibernate.SQL=WARN
logging.level.org.flywaydb=INFO
